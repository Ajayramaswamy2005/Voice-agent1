# Fly.io config. App names are global: change `app` if `fly apps create` says it's taken.
app = "duplex-voice"
primary_region = "bom"  # Mumbai: close to Indian callers and to api.in.deepgram.com

[build]
  dockerfile = "Dockerfile"

[env]
  DEEPGRAM_HOST = "api.in.deepgram.com"
  ENABLED_LINES = "clinic,support"
  MAX_CALLS = "3"
  MAX_CALL_SECONDS = "300"

[http_service]
  internal_port = 8000
  force_https = true  # browsers only allow the microphone on HTTPS
  # One machine stays up: a cold start (MCP servers, Cartesia connect) would make the first caller wait.
  auto_stop_machines = "off"
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/api/config"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"  # startup connects to Cartesia and loads clips

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"  # app + two MCP server processes
